bank: ../../kerdesbank.hu.yaml
devices: ../../eszkozok.yaml

# Éles adatgyűjtés 2026-11-25 óta (a szerző döntése). A Supabase-oldalon a survey_admin.surveys
# sora: accepting_responses = true, retention_until = 2027-12-01, paradata = true.
# Lezárás: accepting_responses = false (és itt a storage.acceptingResponses: false).
settings:
  display:
    scaleInput: ab_test
    defaultEffort: alapos
    privacyNotice: /adatkezeles.html
  storage:
    mode: supabase
    metrics: true
    retentionUntil: 2027-12-01
