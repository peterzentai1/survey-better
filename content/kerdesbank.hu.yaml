# Kérdésbank v0.2: háztartási áramfelhasználás, rugalmasság és méltányosság.
#
# Séma: lásd content/sample.yaml (a fájl végén a feltételnyelv).
# Tételenkénti források és a változtatások indoka: content/KERDESBANK_v0.1.md.
#
# FONTOS
# - A kártyákon szereplő összegek, darabszámok és időtartamok TESZTÉRTÉKEK, nem valós ajánlatok.
#   Kivétel a D árszabás kártyája (F01): az egy valós tarifa leírása (MVM, a 2026-10-25-i oldal alapján).
# - A [SZÖGLETES ZÁRÓJELES] részek helyőrzők, élesítés előtt kitöltendők.
# - A `source` mező csak dokumentáció, a kitöltő nem látja.

version: "0.4.0"
locale: hu

defaults:
  skip: true
  skipLabel: "Nem tudom / kihagyom"
  scale6:
    left: "Egyáltalán nem"
    right: "Teljes mértékben"
    labels: ["Egyáltalán nem", "Nagyrészt nem", "Inkább nem", "Inkább igen", "Nagyrészt igen", "Teljes mértékben"]

# A percek saját becslések (0.3.0): kártyánként kb. 10–12 másodperc a /admin kártyaszámai alapján.
# Élesben a mért mediánok váltják fel őket.
# 0.3.5: két hossz. A korábbi közepes és alapos összevonva „Alap” néven, a teljes (alapos) tartalommal;
# a belső azonosító `alapos` maradt, hogy a mérési tábla és a korábbi adatok értelmezése ne változzon.
effortLevels:
  - { id: rovid,  label: "Rövidített · kb. 5 perc", moduleCaps: { tierCaps: { A: 1, B: 1, C: 0 }, globalModuleCap: 3 } }
  - { id: alapos, label: "Alap · kb. 9 perc",       moduleCaps: { tierCaps: { A: 3, B: 2, C: 1 }, globalModuleCap: 9 } }

blocks:
  - { id: nyitas,       title: "Kezdés" }
  - { id: alapok,       title: "Az Ön háztartása" }
  - { id: eszkozok,     title: "Eszközök" }
  - { id: tarifa,       title: "Számla és tarifa" }
  - { id: indokok,      title: "Mikor igazodna?" }
  - { id: modulok,      title: "Az Ön eszközei" }
  - { id: tervek,       title: "Tervek" }
  - { id: meltanyossag, title: "Igazságosság" }
  - { id: bizalom,      title: "Bizalom és kontroll" }
  - { id: demografia,   title: "Önről" }
  - { id: zaras,        title: "Összegzés" }

cards:
  # ════════════════════════════════════════════════════════════════════════
  # 0. NYITÁS
  # ════════════════════════════════════════════════════════════════════════
  - id: N01
    block: nyitas
    type: info
    title: "Miért kérte a magyar kormány augusztusban a klímák esti kikapcsolását?"
    text: |
      A vezetékek terheltsége számottevő, azonban a magas esti áramár volt a valódi ok. Tudta, hogy az áram ára negyedóránként változik?

      Magyarországon augusztus 13-án a napelemek csúcstermelése majdnem 3,5 Pakssal ért fel (normális paksi termeléshez viszonyítva - 6,9 GW / 2 GW).
      A nálunk telepített napelemkapacitás világi összehasonlításban is rendkívül magasnak számít. Ez lehetőség és felelősség is egyben.

      Ez a kérdőív azt vizsgálja, mennyire áll a háztartások lehetőségében akkor használni az áramot, mikor "sok és olcsó", mennyire tudjuk csökkenteni a használatot akkor, amikor az földgáz elégetésével termelt, sokszor Európából importált drága áram - és hogyan maradhat ez igazságos azoknak is, akik kevesebb erre alkalmas eszközzel rendelkeznek.
    effortLabel: "Mennyi ideje van a kitöltésre?"
    cta: "Mehet! \nVállalom, hogy jól átgondolom a válaszokat."
    source: "Saját. A 0.2.1 nyitószöveg a kitöltő 2026-11-24-i szerkesztése. Ellenőrizendő: a kormányzati kérés oka, a 2026-08-13-i 6,9 GW-os PV-csúcs (MAVIR), a negyedórás ár (HUPX) forrása."

  - id: N02
    block: nyitas
    type: consent
    title: "Köszönöm, hogy megosztja velem a véleményét."
    text: |
      A kérdőívet Zentai Péter mórahalmi lakos készítette a szakdolgozati kutatásához. A válaszok adatkezelője ő. A részvétel önkéntes, és az Ön hozzájárulásán alapul.

      Nem kérek nevet, címet vagy elérhetőséget. A válaszokat 2027. december 1-ig őrzöm egy európai (frankfurti) szerveren, majd törlöm. Az eredményeket csak összesítve közlöm, olyan bontásban, amelyből senki sem azonosítható. Bármelyik kérdést kihagyhatja, és bármikor abbahagyhatja: csak a befejezett kitöltés kerül a szerverre. A végén kap egy kitöltési azonosítót. Ha ezt elküldi nekem, kérésére törlöm a kitöltését, vagy másolatot küldök róla.

      Nincs jó vagy rossz válasz. Választhatja a „Nem tudom / kihagyom” gombot: ez is hasznos információ. A végén visszanézheti és pótolhatja a kihagyott kérdéseket, és kiemelheti a legfontosabbat is!

      A kérdőív 18 éven felülieknek szól. Kérdés esetén: peterzentai1@gmail.com
    participationLabel: "Elolvastam a tájékoztatót, elmúltam 18 éves, és részt veszek a kérdőívben."
    figure:
      src: /kepek/havi-atlagar-2015-2026.jpg
      alt: "Vonaldiagram: a havi átlagos nagykereskedelmi áramár Magyarországon 2015 és 2026 között, forint per kilowattóra. 2021-ig 10–25 Ft körül mozog, 2022 augusztusában 199 Ft-tal tetőzik, 2023 óta 25–65 Ft között ingadozik; 2026 szeptemberében 65 Ft."
    paradataLabel: "Hozzájárulok, hogy a kitöltés technikai adatai (pl. kártyánként eltöltött idő, koppintás, húzás vagy billentyű) is a szerverre kerüljenek. Ez segít a kérdőív javításában; nélküle is kitölthető."
    source: "Saját. 0.3.0: a végleges rövid tájékoztató (platform-terv/2026-11-24_adatkezelesi-tajekoztato.md, A rész), intézményi megnevezés nélkül: az adatkezelő Zentai Péter magánszemélyként (D1). A teljes tájékoztató: public/adatkezeles.html."

  # ════════════════════════════════════════════════════════════════════════
  # 1. ALAPOK
  # ════════════════════════════════════════════════════════════════════════
  - id: A01
    block: alapok
    type: single
    text: "Hol él?"
    options:
      - { value: morahalom_kornyeke, label: "Mórahalom és környéke" }
      - { value: mas,                label: "Máshol Magyarországon" }
      - { value: kulfold,            label: "Külföldön" }
    skip: false
    source: "S16 (szűrő) általánosítva. 0.3.2: kétlépcsős a kitöltő jegyzete alapján; a pontosítás az A01B."

  - id: A01B
    block: alapok
    type: single
    showIf: { answer: A01, in: [morahalom_kornyeke] }
    text: "Pontosabban hol?"
    options:
      - { value: morahalom,            label: "Mórahalom belterülete" }
      - { value: morahalom_kulterulet, label: "Mórahalom külterülete, tanya" }
      - { value: kornyezo,             label: "Környező település" }
    skip: false
    source: "0.3.2: az A01 második lépcsője (kitöltői jegyzet). A Mórahalomra vonatkozó szövegváltozatok kapuja."

  - id: A02
    block: alapok
    effort: 2
    type: single
    text: "Milyen lakásban él?"
    options:
      - { value: csaladi_haz, label: "Családi ház" }
      - { value: iker_sor,    label: "Ikerház vagy sorház" }
      - { value: panel,       label: "Panellakás" }
      - { value: tarsashaz,   label: "Egyéb társasházi lakás" }
      - { value: tanya,       label: "Tanya" }
      - { value: egyeb,       label: "Egyéb" }
    source: "S3; NLM Q5.5"

  - id: A03
    block: alapok
    type: single
    text: "Kié a lakás, és ki dönt például a fűtés cseréjéről vagy a villanyszerződésről?"
    options:
      - { value: sajat_en,      label: "Saját vagy családi, én (is) döntök" }
      - { value: sajat_mas,     label: "Saját vagy családi, de a döntést más hozza meg (pl. szülő, házastárs)" }
      - { value: berelt_berbeado, label: "Bérelt, a bérbeadó dönt" }
      - { value: berelt_en,     label: "Bérelt, de én dönthetek" }
      - { value: egyeb,         label: "Egyéb" }
    source: "S4 (tulajdon és döntési jog egy kérdésben); kritika: hiányzó tulajdon/döntési jog"

  - id: A04
    block: alapok
    effort: 2
    type: single
    layout: pager
    text: "Hányan élnek a háztartásban, Önnel együtt?"
    options:
      - { value: "1",  label: "1" }
      - { value: "2",  label: "2" }
      - { value: "3",  label: "3" }
      - { value: "4",  label: "4" }
      - { value: "5",  label: "5" }
      - { value: "6",  label: "6" }
      - { value: "7",  label: "7" }
      - { value: "8+", label: "8 vagy több" }
    source: "S2; NLM Q5.4"

  - id: A05
    block: alapok
    effort: 2
    type: single
    text: "Hétköznap napközben jellemzően van otthon valaki?"
    options:
      - { value: szinte_mindig, label: "Igen, szinte mindig" }
      - { value: nehany_nap,    label: "Néhány napon" }
      - { value: ritkan,        label: "Ritkán, mindenki dolgozik vagy tanul" }
      - { value: valtozo,       label: "Változó, például műszakos munka miatt" }
      - { value: egyeb,         label: "Egyéb" }
    source: "S13 munkarend, időzítési lehetőségre fordítva (H5). 0.3.2: Egyéb opció, utána szabad szöveg (A05B)."

  - id: A05B
    block: alapok
    effort: 2
    type: free_text
    showIf: { answer: A05, in: [egyeb] }
    text: "Ha szeretné, írja le röviden, hogyan alakul ez Önöknél."
    maxLength: 200
    privacyNote: "Kérjük, ne írjon nevet, címet, telefonszámot vagy más azonosító adatot."
    source: "0.3.2: az A05 „Egyéb” válaszának kifejtése (kitöltői jegyzet)."

  - id: A06
    block: alapok
    type: single
    text: "Mivel fűtik elsősorban a lakást?"
    options:
      - { value: gaz,         label: "Gázzal" }
      - { value: fa,          label: "Fával (kályha, kandalló, sparhelt)" }
      - { value: vegyes,      label: "Vegyes tüzelésű kazánnal (központi fűtés)" }
      - { value: hoszivattyu, label: "Hőszivattyúval (radiátor vagy padlófűtés)" }
      - { value: klima,       label: "Klímával (levegő–levegő)" }
      - { value: elektromos,  label: "Elektromos fűtéssel (panel, hőtárolós kályha)" }
      - { value: tavfutes,    label: "Távfűtéssel" }
      - { value: egyeb,       label: "Egyéb módon" }
    source: "S5; kritika: hiányzó fűtés. Az eszközcsempék előtt áll, mert előre bejelöli a fűtőeszközt."

  # ════════════════════════════════════════════════════════════════════════
  # 2. ESZKÖZÖK
  # ════════════════════════════════════════════════════════════════════════
  - id: E01
    block: eszkozok
    type: multi_tiles
    devicePicker: true
    text: "Mi van a háztartásában? Jelöljön meg mindent, ami van."
    help: "Ha a fűtésnél már megadta, azt előre bejelöltük. Ha mégsem jó, vegye ki."
    options:
      - { value: hoszivattyu,      label: "Hőszivattyú (fűtés)",            icon: hoszivattyu, impliedBy: { answer: A06, in: [hoszivattyu] } }
      - { value: klima,            label: "Klíma",                          icon: klima,       impliedBy: { answer: A06, in: [klima] } }
      - { value: villanybojler,    label: "Villanybojler",                  icon: bojler }
      - { value: elektromos_futes, label: "Elektromos fűtés",               icon: futes,       impliedBy: { answer: A06, in: [elektromos] } }
      - { value: villanyauto,      label: "Villanyautó vagy konnektoros hibrid", icon: auto }
      - { value: napelem,          label: "Napelem",                        icon: napelem }
      - { value: akkumulator,      label: "Otthoni akkumulátor",            icon: akkumulator }
      - { value: mosogep,          label: "Mosógép",                        icon: mosogep }
      - { value: mosogatogep,      label: "Mosogatógép",                    icon: mosogatogep }
      - { value: szarito,          label: "Szárítógép",                     icon: szarito }
      - { value: elektromos_fozes, label: "Elektromos főzőlap vagy sütő",   icon: fozes }
      - { value: szivattyu,        label: "Medence- vagy öntözőszivattyú",  icon: szivattyu }
      - { value: egyik_sem,        label: "Egyik sem",                      icon: nincs }
    exclusive: [egyik_sem]
    source: "NLM Q5.1, Aug. technikai blokk, S5–S11; eszközjegyzet: tulajdon és használat külön (a használat a modulokban)"

  - id: E02
    block: eszkozok
    type: single
    showIf: { owns: napelem }
    text: "Hogyan számolják el a napelemet?"
    options:
      - { value: szaldo, label: "Éves szaldóval (a visszatáplált áramot levonják a vételezettből)" }
      - { value: brutto, label: "Bruttó elszámolással (a visszatáplált áramot külön, alacsonyabb áron veszik át)" }
      - { value: nem_tudom, label: "Nem tudom" }
    skip: false
    source: "S9. A D árszabás (F01) szaldóval jelenleg nem választható: ez méltányossági elemzéshez is kell."

  - id: E03
    block: eszkozok
    type: yesno
    showIf: { all: [ { owns: klima }, { not: { answer: A06, in: [klima] } } ] }
    text: "Fűtenek is klímával a fűtési idényben, legalább kiegészítésként?"
    source: "S8; a fűtő klíma levegő–levegő hőszivattyú, ezért a klíma modulja ilyenkor nagyobb keretet kap."

  - id: E04
    block: eszkozok
    type: multi_tiles
    showIf: { owns: villanyauto }
    text: "Hol szokták tölteni az autót? Mindet jelölje, ahol előfordul."
    options:
      - { value: otthon,    label: "Otthon",             icon: haz }
      - { value: munkahely, label: "A munkahelyen",      icon: epulet }
      - { value: nyilvanos, label: "Nyilvános töltőn",   icon: villam }
    source: "S11; forgatókönyvek EV01–EV08. Az autós modul csak otthoni töltésnél jön. 0.3.2: többes választás a „jellemzően” helyett (kitöltői jegyzet)."

  - id: E04B
    block: eszkozok
    effort: 3
    type: percent_split
    optionsFrom: E04
    text: "Nagyjából milyen arányban oszlik meg az autóba töltött áram a megjelölt töltési helyek között?"
    source: "Saját; az E04 helyszíneinek részletezése a szerkesztői jegyzet alapján."

  # ════════════════════════════════════════════════════════════════════════
  # 3. SZÁMLA ÉS TARIFA
  # ════════════════════════════════════════════════════════════════════════
  - id: T01
    block: tarifa
    type: single
    text: "Az elmúlt egy évben okozott-e nehézséget a rezsiszámlák kifizetése?"
    options:
      - { value: nem,      label: "Nem" }
      - { value: neha,     label: "Néha" }
      - { value: gyakran,  label: "Gyakran" }
      - { value: nem_kivan, label: "Nem kívánok válaszolni" }
    source: "S14; energiaszegénységi moderátor (H5)"

  - id: T02
    block: tarifa
    effort: 2
    type: multi_tiles
    text: "Van külön, vezérelt („éjszakai”) áramköre vagy H tarifája, például a bojlerhez vagy a hőszivattyúhoz? Mindet jelölje, ami van."
    options:
      - { value: vezerelt,  label: "Igen, vezérelt (éjszakai) áramköröm van", icon: ora }
      - { value: h_tarifa,  label: "Igen, H tarifám van (hőszivattyúhoz)",    icon: hoszivattyu }
      - { value: nem,       label: "Nem",                                    icon: nincs }
      - { value: nem_tudom, label: "Nem tudom",                              icon: nemtudom }
    exclusive: [nem, nem_tudom]
    skip: false
    source: "S7. A vezérelt körre a D árszabás nem vonatkozik. 0.3.2: a vezérelt kör és a H tarifa külön (kitöltői jegyzet); együtt is előfordulhat."

  - id: T03
    block: tarifa
    effort: 2
    type: single
    text: "Okos, távolról leolvasható villanyórája van?"
    options:
      - { value: igen,      label: "Igen" }
      - { value: nem,       label: "Nem" }
      - { value: nem_tudom, label: "Nem tudom" }
    skip: false
    source: "S12; NLM Q5.2 (kritika: kell „nem tudom”)"

  - id: T04
    block: tarifa
    effort: 2
    type: consumption
    lead: "A szokásos nappali (A1) tarifán évi 2523 kWh-ig kedvezményes az ár (havi átlagban kb. 210 kWh). A keret fölött magasabb az egységár."
    text: "Nagyjából hány kilowattóra áramot vételeznek egy év alatt a nappali mérőn?"
    sliderMax: 12000
    unknownLabel: "Nem tudom"
    tariff:
      thresholdKwh: 2523
      withinFtPerKwh: 36.386
      aboveFtPerKwh: 70.104
      label: "Példaszámítás az MVM Démász nappali (A1) árával, alapdíj nélkül."
    skip: false
    source: "MVM Next, lakossági A1 árszabás az MVM Démász területén: https://www.mvmnext.hu/aram/servlet/download?id=16214&type=file"

  # ════════════════════════════════════════════════════════════════════════
  # 4. INDOKMAG: rögzített cselekvés, csak az indok változik (véletlen sorrend)
  # ════════════════════════════════════════════════════════════════════════
  - id: I01
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: &indok_lead "Képzelje el, hogy ma jelzést kap, hogy holnap este 17 és 19 óra között jó lenne kevesebb áramot használni. Egy halasztható dolgot (pl. mosást, mosogatást) egy-két órával későbbre tenne…"
    text: "…ha ezzel segítene elkerülni, hogy az országban átmenetileg ne legyen elég áram."
    scale: &valoszinu
      left: "Biztosan nem"
      right: "Biztosan igen"
      labels: ["Biztosan nem", "Valószínűleg nem", "Inkább nem", "Inkább igen", "Valószínűleg igen", "Biztosan igen"]
    source: "Aug-mag #1 (és #3 összevonva); kritika L121–127: „veszélyhelyzet” helyett semleges"

  - id: I02
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha ezzel csökkenne annak a kockázata, hogy a helyi áramhálózat túlterhelődik, és kimarad az áram."
    textVariants:
      - when: { answer: A01B, in: [morahalom, morahalom_kulterulet] }
        text: "…ha ezzel csökkenne annak a kockázata, hogy a mórahalmi áramhálózat túlterhelődik, és kimarad az áram."
    scale: *valoszinu
    source: "Aug-mag #2"

  - id: I03
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha ettől közvetlenül alacsonyabb lenne a villanyszámlája."
    scale: *valoszinu
    source: "Aug-mag #4"

  - id: I04
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha egy hiteles, nyilvános számítás szerint ezzel csökkenne az ország áramimportja."
    scale: *valoszinu
    source: "Aug-mag #8"

  - id: I05
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha az ebből származó megtakarítás egy előre rögzített része átlátható helyi közösségi alapba kerülne."
    textVariants:
      - when: { answer: A01B, in: [morahalom, morahalom_kulterulet] }
        text: "…ha az ebből származó megtakarítás egy előre rögzített része átlátható mórahalmi közösségi alapba kerülne."
    scale: *valoszinu
    source: "Aug-mag #10 (H4)"

  - id: I06
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha tudná, hogy a hasonló helyzetű háztartások többsége is így tesz."
