  - id: F01
    block: meltanyossag
    type: yesno
    lead: "Valós tarifa: az MVM-nél 2027-től alkalmazható „D árszabás”."
    text: |
      Évi 2523 kWh-ig (naponta kb. 6,9 kWh) az áram ára ugyanaz, mint most. Az e fölötti fogyasztás ára negyedóránként változik a nagykereskedelmi árak és az euró árfolyama szerint: van, amikor olcsóbb, és van, amikor drágább a mostaninál.
      Okosmérő kell hozzá, és önkéntes. Aki 12 hónapon belül visszalép, ugyanott 12 hónapig nem választhatja újra.
      Választaná?
    help: "Csak a normál mérőre vonatkozik, a vezérelt (pl. „éjszakai”) áramkörre nem. Szaldós napelemmel, előrefizetős mérővel vagy lejárt tartozással jelenleg nem választható."
    yesLabel: "Választanám"
    noLabel: "Nem választanám"
    source: "K6; MVM Next D árszabás oldal (mentve 2026-10-25): sáv, negyedórás HUPX-ár, EUR, 12 hónapos szabály, kizárások. Élesítés előtt újraellenőrizendő."

