# Kérdésbank v0.1: háztartási áramfelhasználás, rugalmasság és méltányosság.
#
# Séma: lásd content/sample.yaml (a fájl végén a feltételnyelv).
# Tételenkénti források és a változtatások indoka: content/KERDESBANK_v0.1.md.
#
# FONTOS
# - A kártyákon szereplő összegek, darabszámok és időtartamok TESZTÉRTÉKEK, nem valós ajánlatok.
#   Kivétel a D árszabás kártyája (F01): az egy valós tarifa leírása (MVM, a 2026-10-25-i oldal alapján).
# - A [SZÖGLETES ZÁRÓJELES] részek helyőrzők, élesítés előtt kitöltendők.
# - A `source` mező csak dokumentáció, a kitöltő nem látja.

version: "0.1.0"
locale: hu

defaults:
  skip: true
  skipLabel: "Nem tudom / kihagyom"
  scale6:
    left: "Egyáltalán nem"
    right: "Teljes mértékben"
    labels: ["Egyáltalán nem", "Nagyrészt nem", "Inkább nem", "Inkább igen", "Nagyrészt igen", "Teljes mértékben"]

blocks:
  - { id: nyitas,       title: "Kezdés" }
  - { id: alapok,       title: "Az Ön háztartása" }
  - { id: eszkozok,     title: "Eszközök" }
  - { id: tarifa,       title: "Számla és tarifa" }
  - { id: indokok,      title: "Mikor igazodna?" }
  - { id: modulok,      title: "Az Ön eszközei" }
  - { id: tervek,       title: "Tervek" }
  - { id: meltanyossag, title: "Igazságosság" }
  - { id: bizalom,      title: "Bizalom és kontroll" }
  - { id: demografia,   title: "Önről" }
  - { id: zaras,        title: "Összegzés" }

cards:
  # ════════════════════════════════════════════════════════════════════════
  # 0. NYITÁS
  # ════════════════════════════════════════════════════════════════════════
  - id: N01
    block: nyitas
    type: info
    title: "Mikor használjuk az áramot?"
    text: |
      Ez a kérdőív arról szól, mennyire tudnák és akarnák a háztartások máskor használni az áramot, például ha este kevés, délben pedig sok és olcsó van belőle, és mi lenne ebben igazságos azoknak is, akiknek nincs erre alkalmas eszközük.

      Minden kérdés csak egyszer szerepel, és a kérdések az Ön háztartásához igazodnak, ezért a kitöltés kb. 10 perc. Ha egy kérdésre nincs kialakult válasza, válassza a „Nem tudom / kihagyom” gombot: ez is hasznos információ. A végén visszanézheti és pótolhatja a kihagyott kérdéseket, és kiemelheti, ami Önnek a legfontosabb.

      Nincs jó vagy rossz válasz. A kérdésekben szereplő ajánlatok elképzeltek, a bennük lévő összegek csak példák.
    cta: "Kezdjük"
    source: "Saját. A nyitószöveg a jóváhagyott terv szerinti."

  - id: N02
    block: nyitas
    type: consent
    title: "Tájékoztatás"
    text: |
      A kutatást [KUTATÓ], a(z) [INTÉZMÉNY] hallgatója végzi szakdolgozati kutatásként. Adatkezelő: [ADATKEZELŐ]. Jogalap: [JOGALAP].

      A kérdőív névtelen: nem kérünk nevet, címet vagy elérhetőséget. A válaszokat [MEGŐRZÉSI IDŐ] ideig őrizzük, és csak összesítve közöljük. Bármelyik kérdést kihagyhatja, és bármikor abbahagyhatja.

      Kérdés esetén: [ELÉRHETŐSÉG].
    participationLabel: "Elolvastam, és részt veszek a kérdőívben."
    paradataLabel: "Hozzájárulok, hogy a kitöltés technikai adatait is rögzítsék (pl. kártyánként eltöltött idő, koppintás vagy billentyű). Ez segít a kérdőív javításában; nélküle is kitölthető."
    source: "Saját; a helyőrzők a konzulensi válasz után tölthetők ki (adatkezelő, jogalap, megőrzés)."

  # ════════════════════════════════════════════════════════════════════════
  # 1. ALAPOK
  # ════════════════════════════════════════════════════════════════════════
  - id: A01
    block: alapok
    type: single
    text: "Hol él?"
    options:
      - { value: morahalom,            label: "Mórahalom, belterület" }
      - { value: morahalom_kulterulet, label: "Mórahalom külterülete, tanya" }
      - { value: csongrad_csanad,      label: "Más település Csongrád-Csanád vármegyében" }
      - { value: mas,                  label: "Máshol Magyarországon" }
    skip: false
    source: "S16 (szűrő) általánosítva; a Mórahalomra vonatkozó szövegváltozatok kapuja."

  - id: A02
    block: alapok
    type: single
    text: "Milyen lakásban él?"
    options:
      - { value: csaladi_haz, label: "Családi ház" }
      - { value: iker_sor,    label: "Ikerház vagy sorház" }
      - { value: tarsashaz,   label: "Társasházi lakás" }
      - { value: tanya,       label: "Tanya" }
      - { value: egyeb,       label: "Egyéb" }
    source: "S3; NLM Q5.5"

  - id: A03
    block: alapok
    type: single
    text: "Kié a lakás, és ki dönt például a fűtés cseréjéről vagy a villanyszerződésről?"
    options:
      - { value: sajat_en,      label: "Saját vagy családi, én (is) döntök" }
      - { value: sajat_mas,     label: "Saját vagy családi, de más dönt" }
      - { value: berelt_berbeado, label: "Bérelt, a bérbeadó dönt" }
      - { value: berelt_en,     label: "Bérelt, de én dönthetek" }
      - { value: egyeb,         label: "Egyéb" }
    source: "S4 (tulajdon és döntési jog egy kérdésben); kritika: hiányzó tulajdon/döntési jog"

  - id: A04
    block: alapok
    type: single
    layout: chips
    text: "Hányan élnek a háztartásban, Önnel együtt?"
    options:
      - { value: "1",  label: "1" }
      - { value: "2",  label: "2" }
      - { value: "3",  label: "3" }
      - { value: "4",  label: "4" }
      - { value: "5+", label: "5 vagy több" }
    source: "S2; NLM Q5.4"

  - id: A05
    block: alapok
    type: single
    text: "Hétköznap napközben jellemzően van otthon valaki?"
    options:
      - { value: szinte_mindig, label: "Igen, szinte mindig" }
      - { value: nehany_nap,    label: "Néhány napon" }
      - { value: ritkan,        label: "Ritkán, mindenki dolgozik vagy tanul" }
      - { value: valtozo,       label: "Változó, például műszakos munka miatt" }
    source: "S13 munkarend, időzítési lehetőségre fordítva (H5)"

  - id: A06
    block: alapok
    type: single
    text: "Mivel fűtik elsősorban a lakást?"
    options:
      - { value: gaz,         label: "Gázzal" }
      - { value: fa_vegyes,   label: "Fával vagy vegyes tüzeléssel" }
      - { value: hoszivattyu, label: "Hőszivattyúval (pl. levegő–víz)" }
      - { value: klima,       label: "Klímával (levegő–levegő)" }
      - { value: elektromos,  label: "Elektromos fűtéssel (panel, hőtárolós kályha)" }
      - { value: tavfutes,    label: "Távfűtéssel" }
      - { value: egyeb,       label: "Egyéb módon" }
    source: "S5; kritika: hiányzó fűtés. Az eszközcsempék előtt áll, mert előre bejelöli a fűtőeszközt."

  # ════════════════════════════════════════════════════════════════════════
  # 2. ESZKÖZÖK
  # ════════════════════════════════════════════════════════════════════════
  - id: E01
    block: eszkozok
    type: multi_tiles
    devicePicker: true
    text: "Mi van a háztartásában? Jelöljön meg mindent, ami van."
    help: "Ha a fűtésnél már megadta, azt előre bejelöltük. Ha mégsem jó, vegye ki."
    options:
      - { value: hoszivattyu,      label: "Hőszivattyú (fűtés)",            icon: hoszivattyu, impliedBy: { answer: A06, in: [hoszivattyu] } }
      - { value: klima,            label: "Klíma",                          icon: klima,       impliedBy: { answer: A06, in: [klima] } }
      - { value: villanybojler,    label: "Villanybojler",                  icon: bojler }
      - { value: elektromos_futes, label: "Elektromos fűtés",               icon: futes,       impliedBy: { answer: A06, in: [elektromos] } }
      - { value: villanyauto,      label: "Villanyautó vagy konnektoros hibrid", icon: auto }
      - { value: napelem,          label: "Napelem",                        icon: napelem }
      - { value: akkumulator,      label: "Otthoni akkumulátor",            icon: akkumulator }
      - { value: mosogep,          label: "Mosógép",                        icon: mosogep }
      - { value: mosogatogep,      label: "Mosogatógép",                    icon: mosogatogep }
      - { value: szarito,          label: "Szárítógép",                     icon: szarito }
      - { value: elektromos_fozes, label: "Elektromos főzőlap vagy sütő",   icon: fozes }
      - { value: szivattyu,        label: "Medence- vagy öntözőszivattyú",  icon: szivattyu }
      - { value: egyik_sem,        label: "Egyik sem",                      icon: nincs }
    exclusive: [egyik_sem]
    source: "NLM Q5.1, Aug. technikai blokk, S5–S11; eszközjegyzet: tulajdon és használat külön (a használat a modulokban)"

  - id: E02
    block: eszkozok
    type: single
    showIf: { owns: napelem }
    text: "Hogyan számolják el a napelemet?"
    options:
      - { value: szaldo, label: "Éves szaldóval (a visszatáplált áramot levonják a vételezettből)" }
      - { value: brutto, label: "Bruttó elszámolással (a visszatáplált áramot külön, alacsonyabb áron veszik át)" }
      - { value: nem_tudom, label: "Nem tudom" }
    skip: false
    source: "S9. A D árszabás (F01) szaldóval jelenleg nem választható: ez méltányossági elemzéshez is kell."

  - id: E03
    block: eszkozok
    type: yesno
    showIf: { all: [ { owns: klima }, { not: { answer: A06, in: [klima] } } ] }
    text: "Fűtenek is a klímával a fűtési idényben, legalább kiegészítésként?"
    source: "S8; a fűtő klíma levegő–levegő hőszivattyú, ezért a klíma modulja ilyenkor nagyobb keretet kap."

  - id: E04
    block: eszkozok
    type: single
    showIf: { owns: villanyauto }
    text: "Hol töltik jellemzően az autót?"
    options:
      - { value: otthon,    label: "Otthon" }
      - { value: vegyes,    label: "Otthon is, máshol is" }
      - { value: munkahely, label: "Főleg a munkahelyen" }
      - { value: nyilvanos, label: "Főleg nyilvános töltőn" }
    source: "S11; forgatókönyvek EV01–EV08. Az autós modul csak otthoni töltésnél jön."

  # ════════════════════════════════════════════════════════════════════════
  # 3. SZÁMLA ÉS TARIFA
  # ════════════════════════════════════════════════════════════════════════
  - id: T01
    block: tarifa
    type: single
    text: "Az elmúlt egy évben okozott-e nehézséget a rezsiszámlák kifizetése?"
    options:
      - { value: nem,      label: "Nem" }
      - { value: neha,     label: "Néha" }
      - { value: gyakran,  label: "Gyakran" }
      - { value: nem_kivan, label: "Nem kívánok válaszolni" }
    source: "S14; energiaszegénységi moderátor (H5)"

  - id: T02
    block: tarifa
    type: single
    text: "Van külön, vezérelt („éjszakai”) áramköre vagy mérője, például a bojlerhez vagy a hőszivattyúhoz?"
    options:
      - { value: igen,      label: "Igen" }
      - { value: nem,       label: "Nem" }
      - { value: nem_tudom, label: "Nem tudom" }
    skip: false
    source: "S7. A vezérelt körre a D árszabás nem vonatkozik."

  - id: T03
    block: tarifa
    type: single
    text: "Okos, távolról leolvasható villanyórája van?"
    options:
      - { value: igen,      label: "Igen" }
      - { value: nem,       label: "Nem" }
      - { value: nem_tudom, label: "Nem tudom" }
    skip: false
    source: "S12; NLM Q5.2 (kritika: kell „nem tudom”)"

  - id: T04
    block: tarifa
    type: single
    text: "A kedvezményes árú sáv évi 2523 kWh, ez havonta kb. 210 kWh. A háztartása ehhez képest mennyit fogyaszt?"
    options:
      - { value: kevesebb,  label: "Kevesebbet" }
      - { value: annyi,     label: "Nagyjából annyit" }
      - { value: tobb,      label: "Többet" }
      - { value: nem_tudom, label: "Nem tudom" }
    skip: false
    source: "Saját. A 2523 kWh az MVM D árszabás oldaláról (mentve 2026-10-25); a D tarifa csak a sáv fölött ad árjelzést."

  # ════════════════════════════════════════════════════════════════════════
  # 4. INDOKMAG: rögzített cselekvés, csak az indok változik (véletlen sorrend)
  # ════════════════════════════════════════════════════════════════════════
  - id: I01
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: &indok_lead "Képzelje el: előző nap jelzést kap, hogy holnap este 17 és 19 óra között jó lenne kevesebb áramot használni. Egy halasztható dolgot (pl. mosást, mosogatást) egy-két órával későbbre tenne…"
    text: "…ha ezzel segítene elkerülni, hogy az országban átmenetileg ne legyen elég áram."
    scale: &valoszinu
      left: "Biztosan nem"
      right: "Biztosan igen"
      labels: ["Biztosan nem", "Valószínűleg nem", "Inkább nem", "Inkább igen", "Valószínűleg igen", "Biztosan igen"]
    source: "Aug-mag #1 (és #3 összevonva); kritika L121–127: „veszélyhelyzet” helyett semleges"

  - id: I02
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha ezzel csökkenne annak a kockázata, hogy a helyi áramhálózat túlterhelődik, és kimarad az áram."
    textVariants:
      - when: { answer: A01, in: [morahalom, morahalom_kulterulet] }
        text: "…ha ezzel csökkenne annak a kockázata, hogy a mórahalmi áramhálózat túlterhelődik, és kimarad az áram."
    scale: *valoszinu
    source: "Aug-mag #2"

  - id: I03
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha ettől közvetlenül alacsonyabb lenne a villanyszámlája."
    scale: *valoszinu
    source: "Aug-mag #4"

  - id: I04
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha egy hiteles, nyilvános számítás szerint ezzel csökkenne az ország áramimportja."
    scale: *valoszinu
    source: "Aug-mag #8"

  - id: I05
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha az ebből származó megtakarítás egy előre rögzített része átlátható helyi közösségi alapba kerülne."
    textVariants:
      - when: { answer: A01, in: [morahalom, morahalom_kulterulet] }
        text: "…ha az ebből származó megtakarítás egy előre rögzített része átlátható mórahalmi közösségi alapba kerülne."
    scale: *valoszinu
    source: "Aug-mag #10 (H4)"

  - id: I06
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…ha tudná, hogy a hasonló helyzetű háztartások többsége is így tesz."
    scale: *valoszinu
    source: "Aug-mag #11 (leíró norma)"

  - id: I07
    block: indokok
    type: scale6
    randomizeGroup: indokmag
    lead: *indok_lead
    text: "…külön indok és ellentételezés nélkül, egyszerűen önkéntesen."
    scale: *valoszinu
    source: "Aug-mag #12 (alaphelyzet, H1 viszonyítási pontja)"

  # Ellentétes irányú helyzet: napközbeni napenergia-többlet, a fogyasztás ELŐREHOZÁSA (kritika L114–119).
  - id: I08
    block: indokok
    type: scale6
    lead: "Most egy másik helyzet: előző nap jelzést kap, hogy holnap délben sok lesz a napenergia, és bőséges, olcsó lesz az áram."
    text: "Mennyire valószínű, hogy egy halasztható dolgot (pl. mosást, mosogatást) délre hozna előre?"
    scale: *valoszinu
    source: "Aug-mag #9 iránya javítva (előrehozás); kritika L114–119"

  # Közös ajánlat mindenkinek, eszköztől függetlenül (K1).
  - id: I09
    block: indokok
    type: yesno
    lead: "Elképzelt ajánlat (a számok csak példák):"
    text: |
      Előző nap értesítést kap (SMS-ben, levélben vagy telefonon): holnap este 17 és 19 óra között, ha teheti, használjon kevesebb áramot, vagy tegye későbbre, amit tud. Önkéntes, nincs büntetés.
      Évente legfeljebb 10 ilyen nap lenne, és minden teljesített alkalom után 500 Ft jóváírást kap.
      Részt venne benne?
    yesLabel: "Részt vennék"
    noLabel: "Nem vennék részt"
    source: "K1 helyzetkártya; Aug. kontrollvignetta 1 (önkéntes értesítés, kézi reagálás)"

  # ════════════════════════════════════════════════════════════════════════
  # 5. ESZKÖZMODULOK (kapuzva, a keretet az eszkozok.yaml osztja ki)
  #    priority 1 = ajánlat elfogadása, 2 = szolgáltatási határ, 3 = használat vagy felülbírálás
  # ════════════════════════════════════════════════════════════════════════

  # ── Hőszivattyú ──
  - id: M_HP_1
    block: modulok
    type: yesno
    module: hoszivattyu
    priority: 1
    lead: &ajanlat "Elképzelt ajánlat (a számok csak példák):"
    text: |
      A hőszivattyúja egy előre megbeszélt esti időszakban legfeljebb 60 percre kicsit visszavesz, előtte esetleg kicsit előfűt. A lakás hőmérséklete legfeljebb 1 fokkal tér el a beállítottól, havonta legfeljebb 4 alkalommal, és egy gombnyomással bármikor felülbírálhatja, büntetés nélkül.
      Ezért havonta 1000 Ft jóváírást kap.
      Elfogadná?
    yesLabel: "Elfogadnám"
    noLabel: "Nem fogadnám el"
    source: "K2 helyzetkártya; eszközjegyzet szolgáltatási szintjei (±0,5/1/2 °C, 15–120 perc)"

  - id: M_HP_2
    block: modulok
    type: single
    layout: chips
    module: hoszivattyu
    priority: 2
    text: "Egy ilyen esti időszakban legfeljebb hány fokkal lehetne hűvösebb a lakásban?"
    options: &fok_opciok
      - { value: "0",   label: "Semennyivel" }
      - { value: "0.5", label: "Fél fokkal" }
      - { value: "1",   label: "1 fokkal" }
      - { value: "2",   label: "2 fokkal" }
      - { value: "3",   label: "3 vagy több fokkal" }
    source: "K2 szonda (1 helyett 2 fok?) skálává alakítva; eszközjegyzet L163–169"

  - id: M_HP_3
    block: modulok
    type: yesno
    module: hoszivattyu
    priority: 3
    text: "És ha az időszakot nem lehetne egy gombnyomással felülbírálni, csak a hónap elején lemondani, akkor is elfogadná az ajánlatot?"
    yesLabel: "Akkor is elfogadnám"
    noLabel: "Akkor nem"
    source: "K2 szonda (felülbírálás nélkül?); H3"

  # ── Klíma ──
  - id: M_KL_1
    block: modulok
    type: yesno
    module: klima
    priority: 1
    lead: *ajanlat
    text: |
      Kánikulai délutánokon a klímája legfeljebb 60 percre kicsit visszavesz, előtte kicsit előhűt. A lakás legfeljebb 1 fokkal lesz melegebb a beállítottnál, havonta legfeljebb 4 alkalommal, és egy gombnyomással bármikor felülbírálhatja.
      Ezért a nyári hónapokban havonta 1000 Ft jóváírást kap.
      Elfogadná?
    yesLabel: "Elfogadnám"
    noLabel: "Nem fogadnám el"
    source: "K2 nyári változata; forgatókönyv H03 (előhűtés)"

  - id: M_KL_2
    block: modulok
    type: yesno
    module: klima
    priority: 2
    showIf: { any: [ { answer: E03, in: [igen] }, { answer: A06, in: [klima] } ] }
