  # ════════════════════════════════════════════════════════════════════════
  # 10. ÖSSZEGZÉS ÉS KIEMELÉS
  # ════════════════════════════════════════════════════════════════════════
  - id: Z01
    block: zaras
    type: summary_highlight
    text: "Van olyan téma, amit különösen fontosnak tart? Legfeljebb kettőt emelhet ki, és megírhatja a saját véleményét is."
    max: 2
    maxLength: 400
    privacyNote: "Kérjük, ne írjon nevet, címet, telefonszámot vagy más azonosító adatot."
    topics:
      - id: miert
        label: "Miért igazodnék az időzítéssel"
        statements:
          - "Ha az ország vagy a környék áramellátását segíti."
          - "Ha a saját számlámon is látszik."
          - "Ha a közösség is nyer vele."
      - id: kontroll
        label: "Ki dönthet az eszközeimről"
        statements:
          - "Csak én dönthetek, és mindig felülbírálhatom."
          - "Elfogadom az automatikát, ha bármikor kiléphetek."
          - "Senki ne vezérelje távolról az eszközeimet."
      - id: kenyelem
        label: "Kényelem és szolgáltatás"
        statements:
          - "A meleg víz és a lakás hőmérséklete nem sérülhet."
          - "Kis kényelmetlenség belefér, ha előre tudom."
      - id: penz
        label: "Ellentételezés"
        statements:
          - "A jóváírás összege a legfontosabb."
          - "Az összegnél fontosabb, hogy kiszámítható legyen."
      - id: meltanyossag
        label: "Igazságos-e mindenkinek"
        statements:
          - "Akinek nincs ilyen eszköze, ne fizessen többet."
          - "Aki többet tesz, kapjon többet."
          - "A bérlők és az idősek se maradjanak ki."
      - id: adat
        label: "Adatok és biztonság"
        statements:
          - "Aggódom az adataim miatt."
          - "Aggódom a hackertámadások miatt."
      - id: tarifa
        label: "Új tarifák (pl. D árszabás)"
        statements:
          - "A változó ár túl kockázatos."
          - "Jó, hogy van választási lehetőség."
      - id: egyeb
        label: "Valami más"
        statements: []
    source: "A felhasználó kérése: a kiemelés („szuperlájk”) a végén, témaválasztással, kész állítással vagy saját szöveggel."
